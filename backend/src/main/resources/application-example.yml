# Example configuration for production or external PostgreSQL instance
server:
  port: 8080

spring:
  application:
    name: captablex-backend
  profiles:
    active: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/captablex
    username: postgres
    password: YOUR_SECURE_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
